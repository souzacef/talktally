plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.talktally'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springAiVersion', "2.0.0")
	set('postgresql.version', "42.7.13")
}

sourceSets {
	postgresIntegrationTest {
		java.srcDir 'src/postgresIntegrationTest/java'
		resources.srcDir 'src/postgresIntegrationTest/resources'
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	postgresIntegrationTestImplementation.extendsFrom testImplementation
	postgresIntegrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-h2console'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	postgresIntegrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	postgresIntegrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'ai-live', 'ai-voice-live'
	}
}

tasks.register('aiLiveTest', Test) {
	description = 'Runs the opt-in Google GenAI smoke test (requires GOOGLE_API_KEY and network/quota).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ai-live'
	}
	shouldRunAfter tasks.named('test')
}

tasks.register('aiVoiceLiveTest', Test) {
	description = 'Runs the opt-in Google GenAI voice smoke test (requires GOOGLE_API_KEY and network/quota).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'ai-voice-live'
	}
	shouldRunAfter tasks.named('test')
}

tasks.register('postgresIntegrationTest', Test) {
	description = 'Runs the opt-in real PostgreSQL integration suite (requires Docker-compatible container runtime).'
	group = 'verification'
	testClassesDirs = sourceSets.postgresIntegrationTest.output.classesDirs
	classpath = sourceSets.postgresIntegrationTest.runtimeClasspath
	useJUnitPlatform()
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
		showExceptions = true
		showCauses = true
		showStackTraces = true
	}
	shouldRunAfter tasks.named('test')
}

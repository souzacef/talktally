spring:
  application:
    name: talktally-api
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/talktally}
    username: ${DB_USERNAME:talktally}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          model: ${GOOGLE_AI_MODEL:gemini-3.5-flash}
          temperature: 0.2

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

talktally:
  financial-time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  web:
    cors:
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  speech:
    google:
      api-key: ${GOOGLE_API_KEY:}
      tts-model: ${GOOGLE_TTS_MODEL:gemini-3.1-flash-tts-preview}
      tts-voice: ${GOOGLE_TTS_VOICE:Kore}
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    rate-limit:
      enabled: true
      maximum-entries: 10000
      expire-after-access: 2h
      registration:
        capacity: 3
        window: 1h
      login:
        capacity: 10
        window: 1m
      assistant-text:
        capacity: 20
        window: 1m
      assistant-voice:
        capacity: 6
        window: 1m

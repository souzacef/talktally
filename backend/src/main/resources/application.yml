spring:
  application:
    name: talktally-api
  datasource:
    url: ${DB_JDBC_URL:jdbc:postgresql://localhost:5432/talktally}
    username: ${DB_USERNAME:talktally}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    google:
      genai:
        api-key: ${GOOGLE_API_KEY:}
        chat:
          model: ${GOOGLE_AI_MODEL:gemini-3.5-flash}
          temperature: 0.2

talktally:
  financial-time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64:}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}

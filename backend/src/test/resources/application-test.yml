spring:
  ai:
    model:
      chat: none
  datasource:
    url: jdbc:h2:mem:talktally;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate

talktally:
  security:
    jwt:
      # Deliberately public, test-only 256-bit key material (32 zero bytes).
      secret-base64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      access-ttl-seconds: 3600
